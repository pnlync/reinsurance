# SPEC §5.1 — loss-model rules. Money in USD m (2025 as-if basis).
event_threshold_u0: 100           # base, confirmed in M2 (decision D12)
event_threshold_sensitivity: 250
frequency:
  candidates: [poisson, negbin]
  lr_critical: 2.71               # choose NB only if 2(l_NB - l_Pois) > 2.71
severity:
  candidates: [lognormal, loglogistic, burr12]
  top_n_check: 5                  # fitted vs empirical quantiles on the top 5 events
  # D8: tail acceptable if, for each of the top 5 events, P(k-th largest of n simulated events >= observed)
  # under the fitted model lies in this band (a two-sided 90% order-statistic check)
  top_order_stat_band: [0.05, 0.95]
gpd:
  min_exceedances: 25
event_cap_multiple: 3.0           # cap = 3 x largest as-if calibration event
attritional:
  base: bootstrap
  sensitivity: lognormal
# SPEC §6.2: named_storm = name matches hurricane|tropical storm, then reviewed by hand. Hand overrides:
named_storm_overrides:
  "June TS Alberto": true         # "TS" abbreviation for Tropical Storm Alberto (2024)
