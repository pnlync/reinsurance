[project]
name = "floodcat"
version = "0.1.0"
description = "Flood catastrophe reinsurance & capital optimisation for a stylised Gulf Coast portfolio built from OpenFEMA NFIP data"
authors = [
    { name = "pnlync", email = "pnlync@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]
